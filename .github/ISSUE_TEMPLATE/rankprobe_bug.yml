name: RankProbe bug or confusing result
description: Report a reproducible installation, input or report problem
title: "[RankProbe] "
body:
  - type: markdown
    attributes:
      value: "Use original synthetic inputs. Do not attach credentials, private predictions or licensed raw datasets."
  - type: input
    id: version
    attributes:
      label: RankProbe version or source commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: Approximate workload and task / 规模与要解决的问题
      description: Input format, approximate rows/queries, number of runs, and the decision you were trying to make. Counts are enough; do not attach private exports.
  - type: textarea
    id: command
    attributes:
      label: Command and minimal reproduction
      description: Include shareable synthetic rows when possible; remove private identifiers.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and observed behavior
      description: Include the relevant error or report finding and its stated scope.
    validations:
      required: true
